events {}

http {
    upstream backend {
        server app1:8000;
        server app2:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        # Frontend API route -> stripped and proxied to FastAPI upstream
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Preserve direct FastAPI routes, docs, and openapi compatibility
        location ~ ^/(health|db-health|items|backup-status|docs|openapi.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # React Dashboard served at / and all static assets
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
