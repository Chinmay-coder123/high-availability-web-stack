name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-app:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build FastAPI Docker image
        run: docker build -t fastapi-app:ci ./app

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  test-app:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testrootpassword
          MYSQL_DATABASE: api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestrootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: api_test
      DB_USER: root
      DB_PASSWORD: testrootpassword

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Create test database table
        working-directory: app
        run: |
          python - <<'PY'
          import os
          import time
          import mysql.connector

          connection = None

          for attempt in range(30):
              try:
                  connection = mysql.connector.connect(
                      host=os.environ["DB_HOST"],
                      port=int(os.environ["DB_PORT"]),
                      database=os.environ["DB_NAME"],
                      user=os.environ["DB_USER"],
                      password=os.environ["DB_PASSWORD"],
                  )
                  break
              except mysql.connector.Error:
                  if attempt == 29:
                      raise
                  time.sleep(2)

          cursor = connection.cursor()
          cursor.execute("""
              CREATE TABLE IF NOT EXISTS items (
                  id INT NOT NULL AUTO_INCREMENT,
                  name VARCHAR(100) NOT NULL,
                  price DECIMAL(10,2) NOT NULL,
                  PRIMARY KEY (id)
              )
          """)
          connection.commit()
          cursor.close()
          connection.close()
          PY

      - name: Run automated tests
        working-directory: app
        run: python -m pytest -v

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - build-app
      - test-app

    # Deploy only after a push to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'set -e
             cd ~/high-availability-web-stack

             git fetch origin main
             git reset --hard origin/main

             sudo env COMPOSE_PARALLEL_LIMIT=1 docker compose build app1 app2 frontend backup

             sudo docker compose up -d --no-deps app1 app2 frontend nginx backup

             sudo docker compose restart nginx

             sudo docker compose ps'